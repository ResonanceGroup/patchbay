<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Patchbay tray/launcher icon: light variant so it reads on the dark GNOME panel -->
  <rect x="14" y="14" width="228" height="228" rx="44" fill="#3c3c42" stroke="#d2d2d2" stroke-width="8"/>
  <!-- two rotary encoders -->
  <circle cx="86" cy="74" r="24" fill="#3c3c42" stroke="#d2d2d2" stroke-width="5"/>
  <line x1="86" y1="74" x2="86" y2="54" stroke="#3aa0e0" stroke-width="6" stroke-linecap="round"/>
  <circle cx="170" cy="74" r="24" fill="#3c3c42" stroke="#d2d2d2" stroke-width="5"/>
  <line x1="170" y1="74" x2="186" y2="60" stroke="#d2d2d2" stroke-width="6" stroke-linecap="round"/>
  <!-- 4 x 3 key grid -->
  <g fill="#d6d6d6">
    <rect x="44"  y="118" width="34" height="30" rx="7"/>
    <rect x="88"  y="118" width="34" height="30" rx="7"/>
    <rect x="132" y="118" width="34" height="30" rx="7"/>
    <rect x="176" y="118" width="34" height="30" rx="7"/>
    <rect x="44"  y="156" width="34" height="30" rx="7"/>
    <rect x="88"  y="156" width="34" height="30" rx="7"/>
    <rect x="132" y="156" width="34" height="30" rx="7"/>
    <rect x="176" y="156" width="34" height="30" rx="7"/>
    <rect x="44"  y="194" width="34" height="30" rx="7"/>
    <rect x="88"  y="194" width="34" height="30" rx="7"/>
    <rect x="132" y="194" width="34" height="30" rx="7"/>
    <rect x="176" y="194" width="34" height="30" rx="7"/>
  </g>
  <!-- one accent key for identity -->
  <rect x="44" y="118" width="34" height="30" rx="7" fill="#3aa0e0"/>
</svg>
