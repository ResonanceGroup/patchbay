<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 570" font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="none" stroke="#1a1a1a" stroke-width="2">
  <!-- case -->
  <rect x="120" y="40" width="520" height="490" rx="18"/>

  <!-- corner screws -->
  <g stroke-width="1.5">
    <circle cx="142" cy="62" r="6"/><line x1="138" y1="62" x2="146" y2="62"/><line x1="142" y1="58" x2="142" y2="66"/>
    <circle cx="618" cy="62" r="6"/><line x1="614" y1="62" x2="622" y2="62"/><line x1="618" y1="58" x2="618" y2="66"/>
    <circle cx="142" cy="508" r="6"/><line x1="138" y1="508" x2="146" y2="508"/><line x1="142" y1="504" x2="142" y2="512"/>
    <circle cx="618" cy="508" r="6"/><line x1="614" y1="508" x2="622" y2="508"/><line x1="618" y1="504" x2="618" y2="512"/>
  </g>

  <!-- encoders -->
  <g>
    <circle cx="270" cy="150" r="52"/>
    <circle cx="270" cy="150" r="40" stroke-width="1.5"/>
    <line x1="270" y1="150" x2="270" y2="112" stroke-width="3"/>
    <text x="270" y="232" fill="#1a1a1a" stroke="none" font-size="17" font-weight="600" text-anchor="middle">E1</text>

    <circle cx="490" cy="150" r="52"/>
    <circle cx="490" cy="150" r="40" stroke-width="1.5"/>
    <line x1="490" y1="150" x2="462" y2="122" stroke-width="3"/>
    <text x="490" y="232" fill="#1a1a1a" stroke="none" font-size="17" font-weight="600" text-anchor="middle">E2</text>
  </g>

  <!-- key matrix 3 x 4 -->
  <g>
    <rect x="180" y="260" width="80" height="52" rx="7"/>
    <rect x="300" y="260" width="80" height="52" rx="7"/>
    <rect x="420" y="260" width="80" height="52" rx="7"/>

    <rect x="180" y="326" width="80" height="52" rx="7"/>
    <rect x="300" y="326" width="80" height="52" rx="7"/>
    <rect x="420" y="326" width="80" height="52" rx="7"/>

    <rect x="180" y="392" width="80" height="52" rx="7"/>
    <rect x="300" y="392" width="80" height="52" rx="7"/>
    <rect x="420" y="392" width="80" height="52" rx="7"/>

    <rect x="180" y="458" width="80" height="52" rx="7"/>
    <rect x="300" y="458" width="80" height="52" rx="7"/>
    <rect x="420" y="458" width="80" height="52" rx="7"/>
  </g>
  <g fill="#1a1a1a" stroke="none" font-size="15" font-weight="600" text-anchor="middle">
    <text x="220" y="291">K01</text><text x="340" y="291">K02</text><text x="460" y="291">K03</text>
    <text x="220" y="357">K04</text><text x="340" y="357">K05</text><text x="460" y="357">K06</text>
    <text x="220" y="423">K07</text><text x="340" y="423">K08</text><text x="460" y="423">K09</text>
    <text x="220" y="489">K10</text><text x="340" y="489">K11</text><text x="460" y="489">K12</text>
  </g>

  <!-- side button + layer LEDs -->
  <rect x="540" y="266" width="64" height="40" rx="6"/>
  <text x="572" y="291" fill="#1a1a1a" stroke="none" font-size="13" font-weight="600" text-anchor="middle">layer</text>
  <g stroke-width="1.5">
    <circle cx="552" cy="336" r="5"/>
    <circle cx="572" cy="336" r="5"/>
    <circle cx="592" cy="336" r="5"/>
  </g>
  <text x="572" y="364" fill="#555" stroke="none" font-size="12" text-anchor="middle">L1 / L2 / L3</text>

  <!-- annotations -->
  <g fill="#555" stroke="none" font-size="13">
    <text x="668" y="290" text-anchor="middle" transform="rotate(90 668 290)">side button cycles layers</text>
    <text x="84" y="290" text-anchor="middle" transform="rotate(-90 84 290)">3 columns × 4 rows</text>
  </g>
</svg>
